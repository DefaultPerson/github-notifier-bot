services:
  bot:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - BOT_TOKEN
      - GITHUB_WEBHOOK_SECRET
      # Comma-separated extra secrets, one per org/repo webhook (any match passes)
      - GITHUB_WEBHOOK_SECRETS
      - HOST=0.0.0.0
      - PORT=8000
      - CONFIG_PATH=/app/config.yaml
      - DEDUP_TTL_SECONDS=10
      - SECURITY_BATCH_WINDOW_SECONDS=60
      - LOG_LEVEL=INFO
    # Channel routing lives in config.yaml, baked into the image (Dockerfile).
    # No bind-mount: Coolify file-storage edits did not reliably reach the
    # container, which caused events to route with a stale config.
