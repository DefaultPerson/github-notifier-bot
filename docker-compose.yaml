services:
  bot:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - BOT_TOKEN
      - GITHUB_WEBHOOK_SECRET
      # Comma-separated extra secrets, one per org/repo webhook (any match passes)
      - GITHUB_WEBHOOK_SECRETS
      - HOST=0.0.0.0
      - PORT=8000
      # Routing: one destination for every event (see .env.example).
      - CHANNEL_CHAT_ID
      - CHANNEL_THREAD_ID
      - CHANNEL_REPOS
      - CHANNEL_EVENTS
      - CHANNEL_EXCLUDE_EVENTS
      # Fallback multi-channel file, only read when CHANNEL_* are not set.
      - CONFIG_PATH=/app/config.yaml
      - DEDUP_TTL_SECONDS=10
      - SECURITY_BATCH_WINDOW_SECONDS=60
      - LOG_LEVEL=INFO
    # No bind-mount for config.yaml: Coolify file-storage edits did not
    # reliably reach the container, which caused events to route with a
    # stale config. Routing is therefore env-driven; config.yaml is baked
    # into the image (Dockerfile) purely as the multi-channel fallback.
