# Channel routing fallback, baked into the image via the Dockerfile.
#
# Production routing is configured with the CHANNEL_* environment variables
# (CHANNEL_CHAT_ID, CHANNEL_THREAD_ID, CHANNEL_REPOS, CHANNEL_EVENTS,
# CHANNEL_EXCLUDE_EVENTS — see .env.example): one destination for everything.
# When CHANNEL_CHAT_ID and CHANNEL_REPOS are set this file is not read.
#
# The bot refuses to start on an empty channel list, so a deployment with
# neither CHANNEL_* nor a real routing file fails loudly instead of silently
# dropping every event. For multi-channel routing see config.yaml.example.
channels: []
